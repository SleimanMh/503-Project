# EV Charging Optimization — Docker Compose
# Architecture: 3 app containers + 1 monitoring container
# See SYSTEM_DESIGN.md Section 3

services:
  # ── Container 1: API Gateway + Dashboard (EXTERNAL) ──
  gateway:
    build: ./gateway
    ports:
      - "8000:8000"   # API Gateway
      - "8501:8501"   # Streamlit Dashboard
    volumes:
      - ./data:/app/data
    environment:
      - ML_SERVICE_URL=http://ml-service:8001
      - OPTIMIZER_SERVICE_URL=http://optimizer:8002
      - DATA_DIR=/app/data
    networks:
      - internal
    depends_on:
      ml-service:
        condition: service_healthy
      optimizer:
        condition: service_healthy
    restart: unless-stopped

  # ── Container 2: ML Inference Service (INTERNAL) ──
  ml-service:
    build: ./ml-service
    # No ports exposed to host — internal only (Prometheus scrapes via internal network)
    volumes:
      - ./data:/app/data
      - ./ml-service/artifacts:/app/artifacts
    environment:
      - DATA_DIR=/app/data
      - ACN_DATA_PATH=/app/data/acn_sessions.csv
      - MLFLOW_TRACKING_URI=http://monitoring:5000
    networks:
      - internal
    restart: unless-stopped

  # ── Container 3: Optimizer + Grid Validation (INTERNAL) ──
  optimizer:
    build: ./optimizer
    # No ports exposed to host — internal only
    networks:
      - internal
    restart: unless-stopped

  # ── Container 4: Monitoring (Prometheus + Grafana + MLflow) ──
  monitoring:
    build: ./monitoring
    ports:
      - "9090:9090"   # Prometheus
      - "3000:3000"   # Grafana
      - "5000:5000"   # MLflow
    volumes:
      - prometheus_data:/prometheus
      - grafana_data:/var/lib/grafana
      - mlflow_data:/mlflow
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - internal
    restart: unless-stopped

  # ── Retraining service (profile: retrain) ────────────────────────────────
  # Does NOT start with `docker compose up` — only when explicitly triggered.
  # Local:   docker compose --profile retrain run --rm retrain
  # AWS ECS: schedule via EventBridge → RunTask
  retrain:
    build: ./ml-service
    profiles: ["retrain"]
    volumes:
      - ./data:/app/data
      - ./ml-service/artifacts:/app/artifacts
    environment:
      - DATA_DIR=/app/data
      - ACN_DATA_PATH=/app/data/acn_sessions.csv
      - MLFLOW_TRACKING_URI=http://monitoring:5000
      - ML_SERVICE_URL=http://ml-service:8001
    networks:
      - internal
    restart: "no"
    command: >
      sh -c "
        python -m training.prepare_data --data-path /app/data/acn_sessions.csv --output-dir artifacts/ &&
        python -m training.train_departure --artifacts-dir artifacts/ &&
        python -m training.train_energy --artifacts-dir artifacts/ &&
        python -m training.train_arrivals --artifacts-dir artifacts/ &&
        curl -sf -X POST http://ml-service:8001/retrain || echo 'hot-reload skipped (ml-service not reachable)'
      "
    depends_on:
      - ml-service

volumes:
  prometheus_data:
  grafana_data:
  mlflow_data:

networks:
  internal:
    driver: bridge
    # Container 2 and 3 are only accessible via this private network

# ── Retraining service (profile: retrain) ────────────────────────────────────
# Run on-demand or via a cron/scheduler. Does NOT start with `docker compose up`.
#
# Local:   docker compose --profile retrain run --rm retrain
# AWS ECS: use as a scheduled task (EventBridge → ECS RunTask)
# ---------------------------------------------------------------------------
# Note: defined here so it shares the same internal network and data volume
# as ml-service. After training completes, call POST /retrain on ml-service
# to hot-reload without a restart.

