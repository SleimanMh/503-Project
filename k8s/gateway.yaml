# Gateway — API Gateway + Streamlit Dashboard (Container 1)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: ev-charging
  labels:
    app: gateway
    app.kubernetes.io/part-of: ev-charging-optimizer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: gateway
          image: proj-test-gateway:latest
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c", "sed -i 's/\\r$//' /app/start.sh && bash /app/start.sh"]
          ports:
            - containerPort: 8000
              name: api
            - containerPort: 8501
              name: dashboard
          envFrom:
            - configMapRef:
                name: ev-charging-config
          volumeMounts:
            - name: shared-data
              mountPath: /app/data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: shared-data
          persistentVolumeClaim:
            claimName: shared-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: ev-charging
  labels:
    app: gateway
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - name: api
      port: 8000
      targetPort: 8000
      nodePort: 30800
    - name: dashboard
      port: 8501
      targetPort: 8501
      nodePort: 30851
