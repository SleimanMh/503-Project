# Kustomize — apply all K8s manifests in order
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ev-charging

resources:
  - namespace.yaml
  - configmap.yaml
  - volumes.yaml
  - gateway.yaml
  - ml-service.yaml
  - optimizer.yaml
  - monitoring.yaml

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: ev-charging-optimizer
